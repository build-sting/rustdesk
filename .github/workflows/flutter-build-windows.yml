name: Build RustDesk Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-2022
    env:
      RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
      RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "16.0"

      - name: Install vcpkg dependencies (Manifest Mode)
        shell: bash
        run: |
          vcpkg install --triplet x64-windows-static

      - name: Build Flutter Bridge and Core
        shell: bash
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1
          python3 build.py --target x86_64-pc-windows-msvc

      - name: Build Windows Executable
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          cd flutter
          flutter pub get
          flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x86_64
          path: |
            flutter/build/windows/runner/Release/
            target/release/rustdesk.exe
